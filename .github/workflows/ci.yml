name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Environment Versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Run Tests
        run: swift test
